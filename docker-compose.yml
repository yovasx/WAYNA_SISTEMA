version: '3.9'

# ============================================================
#  WAYNA — Stack completo
#  Puertos locales asignados (sin conflictos):
#    Nginx      → localhost:9090
#    PostgreSQL → localhost:5433
#    pgAdmin    → localhost:5051
#    Redis      → localhost:6380
#    Vite HMR   → localhost:5173
# ============================================================

services:

  # ── Laravel + PHP-FPM ────────────────────────────────────
  wayna_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wayna_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:9090}
      DB_CONNECTION: pgsql
      DB_HOST: wayna_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wayna}
      DB_USERNAME: ${DB_USERNAME:-wayna_user}
      DB_PASSWORD: ${DB_PASSWORD:-wayna_secret}
      REDIS_HOST: wayna_redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      VITE_URL: http://host.docker.internal:5173
      QUEUE_CONNECTION: redis
    depends_on:
      wayna_postgres:
        condition: service_healthy
      wayna_redis:
        condition: service_healthy
    networks:
      - wayna_net

  # ── Nginx ─────────────────────────────────────────────────
  wayna_nginx:
    image: nginx:1.27-alpine
    container_name: wayna_nginx
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - wayna_app
    networks:
      - wayna_net

  # ── PostgreSQL ────────────────────────────────────────────
  wayna_postgres:
    image: postgres:17.2
    container_name: wayna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wayna}
      POSTGRES_USER: ${DB_USERNAME:-wayna_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wayna_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - wayna_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wayna_user} -d ${DB_DATABASE:-wayna}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wayna_net

  # ── pgAdmin ───────────────────────────────────────────────
  wayna_pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: wayna_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@wayna.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - wayna_pgadmin_data:/var/lib/pgadmin
    ports:
      - "5051:80"
    depends_on:
      wayna_postgres:
        condition: service_healthy
    networks:
      - wayna_net

  # ── Redis ─────────────────────────────────────────────────
  wayna_redis:
    image: redis:7.4-alpine
    container_name: wayna_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - wayna_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wayna_net

  # ── Node.js — Vite + Tailwind ─────────────────────────────
  wayna_node:
    image: node:20-alpine
    container_name: wayna_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - wayna_net

# ── Volúmenes persistentes ────────────────────────────────
volumes:
  wayna_postgres_data:
    name: wayna_postgres_data
  wayna_pgadmin_data:
    name: wayna_pgadmin_data
  wayna_redis_data:
    name: wayna_redis_data

# ── Red interna ───────────────────────────────────────────
networks:
  wayna_net:
    name: wayna_net
    driver: bridge
